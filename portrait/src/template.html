<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugging Face-incidenten – animationer</title>
<style>
@font-face{font-family:"BigShoulders";font-weight:700;src:url(data:font/ttf;base64,__BSB__) format("truetype");}
@font-face{font-family:"BigShoulders";font-weight:400;src:url(data:font/ttf;base64,__BSR__) format("truetype");}
@font-face{font-family:"GeistMono";font-weight:400;src:url(data:font/ttf;base64,__GMR__) format("truetype");}
@font-face{font-family:"GeistMono";font-weight:700;src:url(data:font/ttf;base64,__GMB__) format("truetype");}
:root{--or:#FF6A00}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"GeistMono",ui-monospace,monospace}
#app{height:100%;display:flex;gap:28px;padding:20px;align-items:stretch;justify-content:center}
#stage{height:100%;aspect-ratio:9/16;max-width:60vw;border:1px solid rgba(255,255,255,.16);flex:none}
canvas{width:100%;height:100%;display:block}
#side{width:340px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-family:"BigShoulders",sans-serif;font-weight:700;font-size:34px;line-height:1;margin:4px 0 2px;letter-spacing:.5px}
p{margin:0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.62)}
#list{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
.sc{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;padding:9px 10px;border-left:2px solid transparent;font-size:13px;color:rgba(255,255,255,.72)}
.sc:hover{background:rgba(255,255,255,.06)}.sc.on{border-left-color:var(--or);color:#fff;background:rgba(255,106,0,.10)}
.sc .n{color:var(--or)}.sc .d{color:rgba(255,255,255,.45);font-size:12px}
.sc:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar button{all:unset;cursor:pointer;border:1px solid rgba(255,255,255,.35);padding:7px 12px;font-size:12px}
#bar button.on,#bar button:hover{border-color:var(--or);color:var(--or)}
#scrub{width:100%;accent-color:var(--or)}#time{font-size:12px;color:rgba(255,255,255,.6)}
body.render #side{display:none}body.render #app{padding:0;display:block}body.render #stage{height:1920px;width:1080px;max-width:none;border:0}
@media (max-width:820px){#app{flex-direction:column;align-items:center;height:auto}#stage{height:auto;width:100%;max-width:420px}#side{width:100%;max-width:420px}#list{max-height:320px}}
</style></head>
<body><div id="app"><div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div id="side"><h1>Hugging Face-incidenten</h1><p>Animationer i 1080×1920. Välj scen, dra i tidslinjen, mellanslag pausar. Nedre tredjedelen är lämnad fri för undertexter.</p>
<div id="list"></div><input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Tid i scenen"><div id="bar"><button id="play">Paus</button><button id="guides">Visa textzoner</button><span id="time"></span></div></div></div>
<script>

</script></body></html>
