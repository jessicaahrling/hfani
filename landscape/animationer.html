:root{--or:#FF6A00}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;font-family:"GeistMono",ui-monospace,monospace}
#app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px;align-items:center}
#stage{width:min(94vw,calc((100vh - 220px)*1.7778));aspect-ratio:16/9;border:1px solid rgba(255,255,255,.16);flex:none;background:#000}
canvas{width:100%;height:100%;display:block}
#side{width:min(94vw,1180px);display:flex;flex-direction:column;gap:10px}
h1{font-family:"BigShoulders",sans-serif;font-weight:700;font-size:26px;line-height:1;margin:2px 0;letter-spacing:.5px}
p{margin:0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.62)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px}
.sc{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;padding:8px 10px;border-left:2px solid transparent;font-size:12px;color:rgba(255,255,255,.72)}
.sc:hover{background:rgba(255,255,255,.06)}.sc.on{border-left-color:var(--or);color:#fff;background:rgba(255,106,0,.10)}
.sc .n{color:var(--or)}.sc .d{color:rgba(255,255,255,.45)}
.sc:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar button{all:unset;cursor:pointer;border:1px solid rgba(255,255,255,.35);padding:7px 12px;font-size:12px}
#bar button.on,#bar button:hover{border-color:var(--or);color:var(--or)}
#scrub{flex:1;min-width:200px;accent-color:var(--or)}#time{font-size:12px;color:rgba(255,255,255,.6)}
body.render #side{display:none}body.render #app{padding:0}body.render #stage{width:1920px;height:1080px;border:0}

<body><div id="app"><div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="side"><h1>Hugging Face-incidenten — Youtube (16:9)</h1><p>Animationer i 1920×1080. Välj scen, dra i tidslinjen, mellanslag pausar.</p>
<div id="list"></div><div id="bar"><input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Tid i scenen"><button id="play">Paus</button><button id="guides">Visa stödlinjer</button><span id="time"></span></div></div></div>
<script>
'use strict';
const W=1920,H=1080,SCX=960,SCY=540;
const OR='#FF6A00',HOT='#FFB677',WH='#FFFFFF';
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={
 io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 o:x=>1-Math.pow(1-x,3),
 i:x=>x*x*x,
 oq:x=>1-(1-x)*(1-x),
 ioq:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,
 ox:x=>x>=1?1:1-Math.pow(2,-10*x),
 ob:x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},
};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hash2=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');

let cv,V,mcv,M,bcv,B,tmp,T;
let CAM={z:1,tx:0,ty:0};
function initCtx(){
  cv=document.getElementById('cv');V=cv.getContext('2d');
  mcv=document.createElement('canvas');mcv.width=W;mcv.height=H;M=mcv.getContext('2d');
  bcv=document.createElement('canvas');bcv.width=W/2;bcv.height=H/2;B=bcv.getContext('2d');
  tmp=document.createElement('canvas');tmp.width=W/2;tmp.height=H/2;T=tmp.getContext('2d');
}
function applyCam(){M.setTransform(CAM.z,0,0,CAM.z,CAM.tx,CAM.ty);B.setTransform(.5*CAM.z,0,0,.5*CAM.z,.5*CAM.tx,.5*CAM.ty);}
function setCam(cx,cy,z,sx=SCX,sy=SCY){CAM={z,tx:sx-cx*z,ty:sy-cy*z};applyCam();}
function resetCam(){CAM={z:1,tx:0,ty:0};applyCam();}
const w2s=(x,y)=>[x*CAM.z+CAM.tx,y*CAM.z+CAM.ty];

function begin(){M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;M.globalCompositeOperation='source-over';M.clearRect(0,0,W,H);

let MASK=0,VIG=0.5;
function finish(){

  V.setTransform(1,0,0,1,0,0);V.globalAlpha=1;V.globalCompositeOperation='source-over';V.fillStyle='#000';V.fillRect(0,0,W,H);
  T.setTransform(1,0,0,1,0,0);T.globalAlpha=1;
  V.globalCompositeOperation='lighter';

let _inited=false;
function ensureInit(){if(_inited)return;initCtx();SCENES.forEach(s=>s.init&&s.init());_inited=true;}
window.SCENES_META=()=>SCENES.map(s=>({id:s.id,name:s.name,dur:s.dur}));
// ta = valfri 'ambient'-klocka (t.ex. tiden i den synkade filmen) så att en utdragen scen ändå lever
window.renderFrame=(i,t,ta)=>{ensureInit();begin();SCENES[i].draw(t,ta===undefined?t:ta);finish();};
window.ready=async()=>{await Promise.all([document.fonts.load('700 100px BigShoulders'),document.fonts.load('400 100px BigShoulders'),document.fonts.load('400 50px GeistMono'),document.fonts.load('700 50px GeistMono')]);await document.fonts.ready;ensureInit();return true;};

// ---------- förhandsvisning (visas inte i #render-läge) ----------
(function(){
  const $=s=>document.querySelector(s);let cur=0,playing=true,t=0,last=0,guides=false,loop=true;
  function build(){const list=$('#list');SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='sc';b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${s.name}</span><span class="d">${s.dur}s</span>`;b.onclick=()=>{cur=i;t=0;playing=true;sync();};list.appendChild(b);});}
  function sync(){document.querySelectorAll('.sc').forEach((b,i)=>b.classList.toggle('on',i===cur));$('#play').textContent=playing?'Paus':'Spela';$('#scrub').max=SCENES[cur].dur;}
  function drawGuides(){if(!guides)return;const k=V;k.setTransform(1,0,0,1,0,0);k.globalAlpha=1;k.strokeStyle='rgba(255,255,255,.45)';k.setLineDash([10,10]);k.lineWidth=2;k.strokeRect(80,80,W-160,H-160);k.setLineDash([]);k.strokeStyle='rgba(255,106,0,.35)';k.beginPath();k.moveTo(W/2,0);k.lineTo(W/2,H);k.moveTo(0,H/2);k.lineTo(W,H/2);k.stroke();k.fillStyle='rgba(255,255,255,.6)';k.font='400 26px GeistMono';k.fillText('safe area 80 px',96,118);}
  function frame(now){if(playing){t+=(now-last)/1000;if(t>=SCENES[cur].dur){if(loop)t=0;else{t=SCENES[cur].dur;playing=false;sync();}}}last=now;
    window.renderFrame(cur,t);drawGuides();$('#scrub').value=t;$('#time').textContent=t.toFixed(1)+' / '+SCENES[cur].dur+' s';requestAnimationFrame(frame);}
  window.addEventListener('DOMContentLoaded',async()=>{if(location.hash==='#render'){document.body.classList.add('render');return;}
    await window.ready();build();sync();
    $('#play').onclick=()=>{playing=!playing;sync();};$('#guides').onclick=()=>{guides=!guides;$('#guides').classList.toggle('on',guides);};
    $('#scrub').oninput=e=>{t=+e.target.value;playing=false;sync();};
    document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing=!playing;sync();}if(e.code==='ArrowRight'){cur=(cur+1)%SCENES.length;t=0;sync();}if(e.code==='ArrowLeft'){cur=(cur+SCENES.length-1)%SCENES.length;t=0;sync();}});
    last=performance.now();requestAnimationFrame(frame);});
})();
