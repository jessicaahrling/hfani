<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugging Face-incidenten – Youtube-animationer</title>
<style>
@font-face{font-family:"BigShoulders";font-weight:700;src:url(data:font/ttf;base64,__BSB__) format("truetype");}
@font-face{font-family:"BigShoulders";font-weight:400;src:url(data:font/ttf;base64,__BSR__) format("truetype");}
@font-face{font-family:"GeistMono";font-weight:400;src:url(data:font/ttf;base64,__GMR__) format("truetype");}
@font-face{font-family:"GeistMono";font-weight:700;src:url(data:font/ttf;base64,__GMB__) format("truetype");}
:root{--or:#FF6A00}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0a0a0a;color:#fff;font-family:"GeistMono",ui-monospace,monospace}
#app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px;align-items:center}
#stage{width:min(94vw,calc((100vh - 220px)*1.7778));aspect-ratio:16/9;border:1px solid rgba(255,255,255,.16);flex:none;background:#000}
canvas{width:100%;height:100%;display:block}
#side{width:min(94vw,1180px);display:flex;flex-direction:column;gap:10px}
h1{font-family:"BigShoulders",sans-serif;font-weight:700;font-size:26px;line-height:1;margin:2px 0;letter-spacing:.5px}
p{margin:0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.62)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px}
.sc{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;padding:8px 10px;border-left:2px solid transparent;font-size:12px;color:rgba(255,255,255,.72)}
.sc:hover{background:rgba(255,255,255,.06)}.sc.on{border-left-color:var(--or);color:#fff;background:rgba(255,106,0,.10)}
.sc .n{color:var(--or)}.sc .d{color:rgba(255,255,255,.45)}
.sc:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar button{all:unset;cursor:pointer;border:1px solid rgba(255,255,255,.35);padding:7px 12px;font-size:12px}
#bar button.on,#bar button:hover{border-color:var(--or);color:var(--or)}
#scrub{flex:1;min-width:200px;accent-color:var(--or)}#time{font-size:12px;color:rgba(255,255,255,.6)}
body.render #side{display:none}body.render #app{padding:0}body.render #stage{width:1920px;height:1080px;border:0}
</style></head>
<body><div id="app"><div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="side"><h1>Hugging Face-incidenten — Youtube (16:9)</h1><p>Animationer i 1920×1080. Välj scen, dra i tidslinjen, mellanslag pausar.</p>
<div id="list"></div><div id="bar"><input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Tid i scenen"><button id="play">Paus</button><button id="guides">Visa stödlinjer</button><span id="time"></span></div></div></div>
<script>

</script></body></html>
